    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f0f0f0;
        }

        /* Top Navigation Bar */
        #navbar {
            background-color: #222;
            color: white;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #nav-left span,
        #nav-right span {
            margin-right: 20px;
            cursor: pointer;
        }

        #nav-left span:hover,
        #nav-right span:hover {
            text-decoration: underline;
        }

        /* Main content layout */
        #content {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }

        /* Levels list */
        .level-card {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        /* Login Popup */
        #loginOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(2px);
            justify-content: center;
            align-items: center;
        }

        #loginBox {
            background: white;
            padding: 25px;
            width: 300px;
            border-radius: 8px;
            position: relative;
        }

        #closePopup {
            position: absolute;
            right: 10px;
            top: 10px;
            cursor: pointer;
            font-size: 18px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <!-- Top Navigation Bar -->
    <div id="navbar">
        <div id="nav-left">
            <span id="navHome">Home</span>

        </div>

        <div id="nav-right">
            <span id="navAccount">Sign In</span>
        </div>

    <!-- Main content -->
    <div id="content">

        <!-- Placeholder Level List -->
        <h2>Recent Levels</h2>

            <input id="password" type="password" placeholder="Password">
            <button id="loginBtn">Log In</button>
            <button id="signupBtn">Sign Up</button>
            <p id="status"></p>
        </div>
    </div>

    <script type="module">
    /* ---------------------------
       Firebase Imports & Setup
    ---------------------------- */
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
    import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
    import {
        getFirestore,
        doc,
        setDoc,
        getDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB1btDw4GxmOi3l2LlkfqZO4GnLxRQKJaE",
        authDomain: "jerrys-juncture.firebaseapp.com",
        projectId: "jerrys-juncture",
        storageBucket: "jerrys-juncture.firebasestorage.app",
        messagingSenderId: "140518116182",
        appId: "1:140518116182:web:e211e7a9ea5d31d99064f7",
        measurementId: "G-MWM8FGGBS4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    /* ---------------------------
       Popup + UI Elements
    ---------------------------- */
    const loginOverlay = document.getElementById("loginOverlay");
    const navAccount = document.getElementById("navAccount");
    const closePopup = document.getElementById("closePopup");

    const emailInput = document.getElementById("email");
    const passInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const signupBtn = document.getElementById("signupBtn");
    const statusText = document.getElementById("status");

    // This replaces "Sign In" when logged in
    const navRight = document.getElementById("nav-right");

    /* ---------------------------
       Popup Controls
    ---------------------------- */
    navAccount.onclick = () => {
        loginOverlay.style.display = "flex";
    };

    closePopup.onclick = () => {
        loginOverlay.style.display = "none";
    };

    loginOverlay.onclick = (e) => {
        if (e.target === loginOverlay) {
            loginOverlay.style.display = "none";
        }
    };

    /* ---------------------------
       Signup
    ---------------------------- */
    signupBtn.onclick = async () => {
        try {
            const userCredential = await createUserWithEmailAndPassword(
                auth,
                emailInput.value,
                passInput.value
            );

            const user = userCredential.user;

            await setDoc(doc(db, "users", user.uid), {
                email: user.email,
                username: user.email.split("@")[0],
                joined: serverTimestamp()
            });

            statusText.style.color = "green";
            statusText.textContent = "Account created!";
        } catch (error) {
            statusText.style.color = "red";
            statusText.textContent = error.message;
        }
    };

    /* ---------------------------
       Login
    ---------------------------- */
    loginBtn.onclick = async () => {
        try {
            const userCredential = await signInWithEmailAndPassword(
                auth,
                emailInput.value,
                passInput.value
            );

            const user = userCredential.user;
            const docSnap = await getDoc(doc(db, "users", user.uid));

            if (docSnap.exists()) {
                updateNavbarUsername(docSnap.data().username);
            }

            statusText.textContent = "";
            loginOverlay.style.display = "none";

        } catch (error) {
            statusText.style.color = "red";
            statusText.textContent = error.message;
        }
    };

    /* ---------------------------
       Logout
    ---------------------------- */
    function createLogoutButton() {
        const btn = document.createElement("span");
        btn.textContent = "Log Out";
        btn.style.cursor = "pointer";
        btn.onclick = async () => {
            await signOut(auth);
        };
        return btn;
    }

    /* ---------------------------
       Update Navbar Username
    ---------------------------- */
    function updateNavbarUsername(username) {
        navRight.innerHTML = "";

        const userSpan = document.createElement("span");
        userSpan.textContent = username;

        const logoutSpan = createLogoutButton();

        navRight.appendChild(userSpan);
        navRight.appendChild(logoutSpan);
    }

    /* ---------------------------
       Auth State Listener
    ---------------------------- */
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const docSnap = await getDoc(doc(db, "users", user.uid));

            if (docSnap.exists()) {
                updateNavbarUsername(docSnap.data().username);
            }
        } else {
            navRight.innerHTML = `<span id="navAccount">Sign In</span>`;
            document.getElementById("navAccount").onclick = () => {
                loginOverlay.style.display = "flex";
            };
        }
    });
</script>
</body>
